<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Panel</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d12;
      color: #f3f4f6;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #141821;
      border: 1px solid #262c3a;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #ffffff;
    }
    p {
      margin: 0 0 18px;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      background: #1c2230;
      border: 1px solid #2d364b;
      font-size: 13px;
      color: #a7f3d0;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      color: #0b0d12;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.92;
    }
    pre {
      margin-top: 14px;
      background: #0c0f15;
      border: 1px solid #222836;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      color: #d1d5db;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shadow Panel</h1>
    <p>تم النشر على Vercel والربط بقاعدة بيانات Supabase بنجاح.</p>
    <div id="status" class="status">جاهز لاختبار الاتصال...</div>
    <button id="testBtn">اختبار اتصال Supabase</button>
    <pre id="output">{ "ready": true }</pre>
  </div>

  <script>
    const SUPABASE_URL = "https://cpsjgauzgpgilchkolzy.supabase.co";
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const testBtn = document.getElementById("testBtn");

    testBtn.addEventListener("click", async () => {
      statusEl.textContent = "جاري التحقق من الخادم...";
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/`, {
          method: "GET"
        });
        statusEl.textContent = `تم الوصول للخادم (الحالة: ${res.status})`;
        outputEl.textContent = JSON.stringify({
          projectUrl: SUPABASE_URL,
          httpStatus: res.status
        }, null, 2);
      } catch (err) {
        statusEl.textContent = "تعذر الوصول للخادم";
        outputEl.textContent = JSON.stringify({ error: err.message }, null, 2);
      }
    });
  </script>
</body>
</html>
