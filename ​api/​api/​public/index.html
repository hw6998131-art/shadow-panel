<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SHADOW PANEL — Key Gate</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#090b10;color:#f3f5f8;padding:20px}.box{max-width:520px;margin:auto;background:#121622;border:1px solid #242b3d;border-radius:14px;padding:20px}h2{margin:0 0 12px;color:#00e5ff}input{width:100%;padding:12px;border-radius:10px;border:1px solid #2c344a;background:#0b0e16;color:#fff;margin-bottom:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#00e5ff;color:#05080d;font-weight:700;cursor:pointer;margin-top:6px}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#181e2e;font-size:14px}.panel{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #242b3d}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}</style></head><body><div class="box"><h2>بوابة تفعيل SHADOW</h2><input id="keyInput" placeholder="أدخل مفتاح التفعيل مثل SHDW-TEST-1234-5678"/><button id="verifyBtn">تحقق من المفتاح</button><div id="msg" class="msg">جاهز للتحقق</div><div id="panel" class="panel"><h3>إعدادات المميزات</h3><div class="row"><span>تفعيل الوضع السريع</span><input id="f1" type="checkbox" style="width:auto;margin:0"/></div><div class="row"><span>تفعيل الأداء العالي</span><input id="f2" type="checkbox" style="width:auto;margin:0"/></div><button id="saveBtn">حفظ المميزات</button></div></div><script>const msg=document.getElementById("msg"),panel=document.getElementById("panel"),keyInput=document.getElementById("keyInput"),f1=document.getElementById("f1"),f2=document.getElementById("f2");let activeKey="";document.getElementById("verifyBtn").onclick=async()=>{const k=keyInput.value.trim();if(!k)return msg.textContent="اكتب المفتاح الأول";msg.textContent="جاري التحقق...";try{const r=await fetch("/api/verify?key="+encodeURIComponent(k));const d=await r.json();if(!d.valid){panel.style.display="none";return msg.textContent="المفتاح غير صالح: "+(d.message||"")}activeKey=k;f1.checked=!!(d.features&&d.features.fast_mode);f2.checked=!!(d.features&&d.features.high_perf);panel.style.display="block";msg.textContent="تم التفعيل بنجاح"+(d.expires_at?" | ينتهي: "+d.expires_at:"")}catch(e){msg.textContent="خطأ في الاتصال بالخادم"}};document.getElementById("saveBtn").onclick=async()=>{if(!activeKey)return;msg.textContent="جاري الحفظ...";try{const r=await fetch("/api/save-features",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:activeKey,features:{fast_mode:f1.checked,high_perf:f2.checked}})});const d=await r.json();msg.textContent=d.ok?"تم حفظ المميزات في قاعدة البيانات":"فشل الحفظ"}catch(e){msg.textContent="خطأ أثناء الحفظ"}}</script></body></html>
